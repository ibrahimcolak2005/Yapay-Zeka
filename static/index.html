<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Uygulaması</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    />
    <style>
        body {
            background: #f0f2f5;
            min-height: 100vh;
        }
        .todo-card {
            max-width: 600px;
        }
        .todo-item {
            transition: background 0.2s;
        }
        .todo-item:hover {
            background: #f8f9fa;
        }
        .btn-delete {
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .btn-delete:hover {
            opacity: 1;
        }
        .empty-state {
            color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="container py-5 d-flex justify-content-center">
        <div class="todo-card w-100">
            <!-- Başlık -->
            <div class="text-center mb-4">
                <h2 class="fw-bold"><i class="bi bi-check2-square me-2"></i>Görevlerim</h2>
                <p class="text-muted mb-0">Yapılacaklar listeni kolayca yönet</p>
            </div>

            <!-- Görev Ekleme Formu -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <form id="todoForm">
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">Görev Başlığı</label>
                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                placeholder="Örn: Markete git"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Açıklama
                                <span class="text-muted fw-normal">(isteğe bağlı)</span>
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="description"
                                placeholder="Örn: Süt, ekmek, yumurta al"
                            />
                        </div>
                        <div class="mb-3">
                            <label for="dueDate" class="form-label fw-semibold">Bitirme Tarihi
                                <span class="text-muted fw-normal">(isteğe bağlı)</span>
                            </label>
                            <input
                                type="date"
                                class="form-control"
                                id="dueDate"
                            />
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-plus-lg me-1"></i>Görev Ekle
                        </button>
                    </form>
                </div>
            </div>

            <!-- Görev Listesi -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div
                        id="todoList"
                        class="list-group list-group-flush"
                    >
                        <!-- JS ile doldurulacak -->
                    </div>
                    <div id="emptyState" class="text-center py-5 empty-state" style="display:none;">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Henüz görev eklenmemiş
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "/todos";

        // ---------- Görevleri Getir ----------
        async function fetchTodos() {
            const res = await fetch(API);
            const todos = await res.json();
            renderTodos(todos);
        }

        // ---------- Görev Listesini Çiz ----------
        function renderTodos(todos) {
            const list = document.getElementById("todoList");
            const empty = document.getElementById("emptyState");

            if (todos.length === 0) {
                list.innerHTML = "";
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";
            list.innerHTML = todos
                .map(
                    (t) => {
                        let dueBadge = "";
                        if (t.due_date) {
                            const today = new Date().toISOString().slice(0, 10);
                            const isOverdue = t.due_date < today;
                            const badgeClass = isOverdue ? "bg-danger" : "bg-primary";
                            const formatted = new Date(t.due_date).toLocaleDateString("tr-TR");
                            dueBadge = `<span class="badge ${badgeClass} ms-2"><i class="bi bi-calendar-event me-1"></i>${formatted}</span>`;
                        }
                        return `
                <div class="list-group-item todo-item d-flex align-items-start justify-content-between py-3">
                    <div>
                        <h6 class="mb-1 fw-semibold">${escapeHtml(t.title)}${dueBadge}</h6>
                        ${t.description ? `<small class="text-muted">${escapeHtml(t.description)}</small>` : ""}
                    </div>
                    <button
                        class="btn btn-outline-danger btn-sm btn-delete ms-3"
                        onclick="deleteTodo(${t.id})"
                        title="Sil"
                    >
                        <i class="bi bi-trash3"></i>
                    </button>
                </div>`;
                    }
                )
                .join("");
        }

        // ---------- Görev Ekle ----------
        document.getElementById("todoForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();
            const dueDate = document.getElementById("dueDate").value || null;

            if (!title) return;

            await fetch(API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    title,
                    description: description || null,
                    completed: false,
                    due_date: dueDate,
                }),
            });

            document.getElementById("todoForm").reset();
            fetchTodos();
        });

        // ---------- Görev Sil ----------
        async function deleteTodo(id) {
            await fetch(`${API}/${id}`, { method: "DELETE" });
            fetchTodos();
        }

        // ---------- XSS Koruması ----------
        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // ---------- Sayfa Yüklendiğinde ----------
        fetchTodos();
    </script>
</body>
</html>
